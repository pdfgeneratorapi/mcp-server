services:
  mcp-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pdf-generator-mcp-server
    ports:
      - "3001:3000"
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
